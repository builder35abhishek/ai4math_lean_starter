name: Mathlib Medium Agent

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "reports/**"
      - "README.md"

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  medium-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Elan toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            elan-${{ runner.os }}-

      - name: Restore Lake and Mathlib cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
            ~/.cache/mathlib
            lake-manifest.json
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      - name: Prepare Mathlib
        run: |
          if [ ! -f lake-manifest.json ]; then
            lake update
          else
            echo "Using cached lake-manifest.json"
          fi
          if [ ! -d .lake/packages/mathlib/.lake/build/lib/lean/Mathlib ]; then
            lake exe cache get || true
          else
            echo "Using cached Mathlib build"
          fi

      - name: Run medium benchmark
        run: |
          mkdir -p reports
          LEAN_CMD="lake env lean" python src/run_agent.py \
            --benchmark benchmarks/mathlib_medium_theorems.jsonl \
            --out reports/mathlib_medium_results.jsonl \
            --max-candidates 16 \
            --max-repairs 8

      - name: Write medium metrics
        if: success()
        run: |
          python src/report_metrics.py \
            --results reports/mathlib_medium_results.jsonl \
            --out reports/mathlib_medium_metrics.md

      - name: Run v4 65-theorem benchmark
        if: success()
        run: |
          LEAN_CMD="lake env lean" python src/run_agent.py \
            --benchmark benchmarks/mathlib_medium_v4_100_theorems.jsonl \
            --out reports/mathlib_medium_v4_results.jsonl \
            --max-candidates 16 \
            --max-repairs 8

      - name: Write v4 65-theorem metrics
        if: success()
        run: |
          python src/report_metrics.py \
            --results reports/mathlib_medium_v4_results.jsonl \
            --out reports/mathlib_medium_v4_metrics.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-medium-agent-results
          path: reports/mathlib_medium_results.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload passing metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-medium-agent-metrics
          path: reports/mathlib_medium_metrics.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v4 benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-medium-v4-agent-results
          path: reports/mathlib_medium_v4_results.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v4 passing metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-medium-v4-agent-metrics
          path: reports/mathlib_medium_v4_metrics.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit passing medium reports
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mathlib_medium_results.jsonl reports/mathlib_medium_metrics.md reports/mathlib_medium_v4_results.jsonl reports/mathlib_medium_v4_metrics.md || true
          if git diff --cached --quiet; then
            echo "No medium report changes to commit."
          else
            git commit -m "Update passing medium proof agent reports [skip ci]"
            git push
          fi
