name: Mathlib Medium Agent

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "reports/**"
      - "README.md"

permissions:
  contents: write
  actions: read

jobs:
  medium-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      - name: Prepare Mathlib
        run: |
          lake update
          lake exe cache get || true

      - name: Run medium benchmark
        run: |
          mkdir -p reports
          LEAN_CMD="lake env lean" python src/run_agent.py \
            --benchmark benchmarks/mathlib_medium_theorems.jsonl \
            --out reports/mathlib_medium_results.jsonl \
            --max-candidates 16 \
            --max-repairs 8

      - name: Write medium metrics
        if: always() && hashFiles('reports/mathlib_medium_results.jsonl') != ''
        run: |
          python src/report_metrics.py \
            --results reports/mathlib_medium_results.jsonl \
            --out reports/mathlib_medium_metrics.md

      - name: Upload medium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-medium-agent-results
          path: |
            reports/mathlib_medium_results.jsonl
            reports/mathlib_medium_metrics.md

      - name: Commit medium reports
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mathlib_medium_results.jsonl reports/mathlib_medium_metrics.md || true
          if git diff --cached --quiet; then
            echo "No medium report changes to commit."
          else
            git commit -m "Update medium proof agent reports [skip ci]"
            git push
          fi
