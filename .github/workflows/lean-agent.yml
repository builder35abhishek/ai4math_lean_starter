name: Lean Proof Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  lean-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean
        run: |
          lean --version
          lake --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run benchmarks
        run: |
          mkdir -p reports

          python src/run_toy.py \
            --benchmark benchmarks/toy_theorems.jsonl \
            --out reports/toy_results.jsonl

          python src/run_toy.py \
            --benchmark benchmarks/beginner_theorems.jsonl \
            --out reports/beginner_results.jsonl

          python src/run_toy.py \
            --benchmark benchmarks/repair_theorems.jsonl \
            --out reports/repair_results.jsonl

      - name: Write run summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# Lean Proof Agent Run"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Timestamp UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Generated reports"
            find reports -maxdepth 1 -type f -print | sort | sed 's#^#- #'
          } > reports/last_run_summary.md

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-results
          path: |
            reports/

      - name: Commit reports to repository
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update Lean benchmark reports [skip ci]"
            git push
          fi
