name: Lean Proof Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  lean-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean
        run: |
          lean --version
          lake --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run core benchmarks
        run: |
          mkdir -p reports

          python src/run_toy.py \
            --benchmark benchmarks/toy_theorems.jsonl \
            --out reports/toy_results.jsonl

          python src/run_toy.py \
            --benchmark benchmarks/beginner_theorems.jsonl \
            --out reports/beginner_results.jsonl

          python src/run_toy.py \
            --benchmark benchmarks/repair_theorems.jsonl \
            --out reports/repair_results.jsonl

          python src/run_agent.py \
            --benchmark benchmarks/actual_theorems.jsonl \
            --out reports/actual_results.jsonl \
            --max-candidates 5

      - name: Write core run summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# Lean Proof Agent Core Run"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Timestamp UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Generated reports"
            find reports -maxdepth 1 -type f -print | sort | sed 's#^#- #'
          } > reports/last_run_summary.md

      - name: Upload core results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-core-results
          path: |
            reports/

      - name: Commit core reports to repository
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No core report changes to commit."
          else
            git commit -m "Update Lean core benchmark reports [skip ci]"
            git push
          fi

  mathlib-test:
    runs-on: ubuntu-latest
    needs: lean-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean and Lake
        run: |
          lean --version
          lake --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch Mathlib dependencies
        run: |
          lake update

      - name: Download Mathlib cache
        run: |
          lake exe cache get || true

      - name: Build Mathlib project smoke target
        run: |
          mkdir -p Ai4Math
          cat > Ai4Math/Smoke.lean <<'EOF'
          import Mathlib

          theorem mathlib_smoke_nat_add_comm (a b : Nat) : a + b = b + a := by
            simpa using Nat.add_comm a b
          EOF
          lake build Ai4Math.Smoke

      - name: Run Mathlib benchmark
        run: |
          mkdir -p reports
          python src/run_agent.py \
            --benchmark benchmarks/mathlib_theorems.jsonl \
            --out reports/mathlib_results.jsonl \
            --max-candidates 5

      - name: Write Mathlib run summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# Lean Proof Agent Mathlib Run"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Timestamp UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Generated reports"
            find reports -maxdepth 1 -type f -print | sort | sed 's#^#- #'
          } > reports/mathlib_last_run_summary.md

      - name: Upload Mathlib results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-mathlib-results
          path: |
            reports/

      - name: Commit Mathlib reports to repository
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add reports/
          if git diff --cached --quiet; then
            echo "No Mathlib report changes to commit."
          else
            git commit -m "Update Lean Mathlib benchmark reports [skip ci]"
            git push
          fi
