name: Mathlib Proof Agent

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  mathlib-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean and Lake
        run: |
          lean --version
          lake --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch Mathlib dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get || true

      - name: Check Mathlib import smoke test
        run: |
          printf '%s\n' \
            'import Mathlib.Tactic' \
            '' \
            'theorem mathlib_smoke_nat_add_comm (a b : Nat) : a + b = b + a := by' \
            '  simpa using Nat.add_comm a b' \
            > MathlibSmoke.lean
          lake env lean MathlibSmoke.lean

      - name: Run actual Mathlib benchmark
        run: |
          mkdir -p reports
          LEAN_CMD="lake env lean" python src/run_agent.py \
            --benchmark benchmarks/mathlib_theorems.jsonl \
            --out reports/mathlib_results.jsonl \
            --max-candidates 5

      - name: Write Mathlib run summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# Mathlib Proof Agent Run"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Timestamp UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Generated reports"
            find reports -maxdepth 1 -type f -print | sort | sed 's#^#- #'
          } > reports/mathlib_last_run_summary.md

      - name: Upload Mathlib results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-proof-agent-results
          path: reports/

      - name: Commit Mathlib reports to repository
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No Mathlib report changes to commit."
          else
            git commit -m "Update Mathlib proof agent reports [skip ci]"
            git push
          fi
